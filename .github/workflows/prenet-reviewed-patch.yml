name: Apply reviewed PreNet reliability patch
on:
  push:
    branches: [repair/prenet-reliability-20260919]
    paths: [.github/prenet-reviewed.patch]
permissions:
  contents: write
jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repair/prenet-reliability-20260919
          fetch-depth: 0
      - name: Verify inputs, apply patch, run isolated regression tests
        shell: bash
        run: |
          set -euo pipefail
          echo '0d380f3bae58365e052811e06470e5cb92f9bbeeb43450fb6ca52820106ed753  sing-box.sh' | sha256sum -c -
          echo '4842b40fdc692de0daaeaef79e99aa7495236b951b66a7255dc03619049b75c3  .github/prenet-reviewed.patch' | sha256sum -c -
          git apply --check .github/prenet-reviewed.patch
          git apply .github/prenet-reviewed.patch
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
          for test_script in tests/*.sh; do
            echo "Running $test_script"
            timeout 120 bash "$test_script"
          done
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -S error
          echo 'c291e7c8f075945fc60932a3a4d47e937672b554ebedbb2b3202276284cc2fee  sing-box.sh' | sha256sum -c -
      - name: Commit validated source and remove temporary patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/prenet-reviewed.patch .github/workflows/prenet-reviewed-patch.yml
          git add -- sing-box.sh tests/test_warp_failure_cache.sh
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: make WARP menu passive and pin validated cfy updater'
          git push origin HEAD:refs/heads/repair/prenet-reliability-20260919
