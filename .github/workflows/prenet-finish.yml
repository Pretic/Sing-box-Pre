name: Validate reviewed active-core WARP repair
on:
  push:
    branches: [repair/prenet-finish-20260919]
    paths: [.github/prenet-build.py, .github/prenet-active-health.sh, .github/workflows/prenet-finish.yml]
permissions:
  contents: write
jobs:
  reviewed-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repair/prenet-finish-20260919
          fetch-depth: 0
      - name: Build and validate all source and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/prenet-build.py
          git ls-files -z -- '*.sh' | xargs -0 -n1 bash -n
          for test_script in tests/*.sh; do
            echo "Running $test_script"
            timeout 120 bash "$test_script"
          done
          git ls-files -z -- '*.sh' | xargs -0 shellcheck -S error
          echo '748583831715430e1759f408df9c53b896b7f93b88eba5bea83b8d88d94530df  sing-box.sh' | sha256sum -c -
      - name: Commit validated result and remove one-time build inputs
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/prenet-build.py .github/prenet-active-health.sh .github/workflows/prenet-finish.yml
          git add -- sing-box.sh tests/test_warp_ipv6_activation_verification.sh tests/test_warp_status_progress.sh
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: verify active WARP through authenticated loopback in the running core'
          git push origin HEAD:refs/heads/repair/prenet-finish-20260919
